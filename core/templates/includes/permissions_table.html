<div class="card card-structure mt-4">
  <div class="card-header">
    <h5 class="mb-0">{{ perm_table_title }}</h5>
  </div>
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-bordered table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th style="width: 250px;">权限</th>
            {% for role_label in perm_role_labels %}
            <th class="text-center">{{ role_label }}</th>
            {% endfor %}
          </tr>
        </thead>
        <tbody>
          {% for perm_name, perm_label, role_perms in perm_rows %}
          <tr>
            <td>{{ perm_label }}</td>
            {% for role_has in role_perms %}
            <td class="text-center">
              {% if role_has %}
              <i class="bi bi-check-lg text-success"></i>
              {% else %}
              <i class="bi bi-x-lg text-muted"></i>
              {% endif %}
            </td>
            {% endfor %}
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
