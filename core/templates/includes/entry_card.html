<a href="{{ entry_url }}" class="text-decoration-none">
  <div class="card h-100 entry-card shadow-sm border-0">
    <div class="card-body text-center p-4">
      <div class="entry-card-figure mb-3">
        <i class="bi {{ entry_icon }} fs-1"></i>
      </div>
      <h5 class="card-title">{{ entry_title }}</h5>
      <p class="card-text text-muted small">{{ entry_desc }}</p>
    </div>
  </div>
</a>
