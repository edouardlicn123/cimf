<div class="card card-structure mt-4">
  <div class="card-header">
    <h5 class="mb-0">{{ table_title }}</h5>
  </div>
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            {% for header in table_headers %}
            <th>{{ header }}</th>
            {% endfor %}
          </tr>
        </thead>
        <tbody>
          {% if table_rows %}
          {% for row in table_rows %}
          <tr>
            {% for cell in row %}
            <td>{{ cell }}</td>
            {% endfor %}
          </tr>
          {% endfor %}
          {% else %}
          <tr>
            <td colspan="{{ table_headers|length }}" class="text-center text-muted py-3">{{ table_empty_msg }}</td>
          </tr>
          {% endif %}
        </tbody>
      </table>
    </div>
  </div>
</div>
