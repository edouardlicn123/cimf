{% extends "base.html" %}
{% block title %}{{ error_code }} - {{ error_title }} - {{ system_name|default('CIMF') }}{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div class="mb-4">
    <i class="bi {{ error_icon|default('bi-exclamation-triangle') }}" style="font-size: 4rem; color: var(--bs-warning);"></i>
  </div>
  <h1 class="display-1 fw-bold text-muted">{{ error_code }}</h1>
  <h4 class="mb-3">{{ error_title }}</h4>
  <p class="text-muted mb-4">{{ error_message }}</p>
  <a href="{{ url('core:dashboard') }}" class="btn btn-primary">
    <i class="bi bi-house me-1"></i>返回首页
  </a>
</div>
{% endblock %}
