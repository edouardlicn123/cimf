<!-- 功能卡片区域 -->
<div class="card card-structure mt-4">
    <div class="card-header">
        <h5 class="mb-0"><i class="bi bi-grid-3x3-gap me-2"></i>快捷入口</h5>
    </div>
    <div class="card-body p-0">
        <div id="dashboardCardsArea" class="row g-0">
            <div class="col-4 card-slot p-1" data-position="1"></div>
            <div class="col-4 card-slot p-1" data-position="2"></div>
            <div class="col-4 card-slot p-1" data-position="3"></div>
            <div class="col-4 card-slot p-1" data-position="4"></div>
            <div class="col-4 card-slot p-1" data-position="5"></div>
            <div class="col-4 card-slot p-1" data-position="6"></div>
        </div>
    </div>
</div>

<style>
.module-card {
    height: 100%;
    width: 100%;
    cursor: grab;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    border: none;
    border-radius: 0;
    box-shadow: var(--shadow);
}
.module-card:hover {
    box-shadow: inset 0 0 0 1px #fff;
}
.module-card:active {
    cursor: grabbing;
}
.module-card.dragging {
    opacity: 0.5;
}
</style>

    var lunarMonth = ['正', '二', '三', '四', '五', '六', '七', '八', '九', '十', '冬', '腊'];
    var lunarDay = ['初一', '初二', '初三', '初四', '初五', '初六', '初七', '初八', '初九', '初十',

    var gan = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
    var zhi = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
    var shengxiao = ['鼠', '牛', '虎', '兔', '龙', '蛇', '马', '羊', '猴', '鸡', '狗', '猪'];

    function getLunarDate(date) {
        var year = date.getFullYear();
        var month = date.getMonth() + 1;
        var day = date.getDate();

        var offset = (Date.UTC(year, month - 1, day) - Date.UTC(1900, 0, 31)) / 86400000;
        if (offset < 0) return { lunar: '' };

        var i, temp, isLeap = false, leap, m, yearDays;

        // Find the lunar year
        for (i = 0; i < lunarInfo.length; i++) {
            yearDays = 0;
            leap = lunarInfo[i] & 0xf;
            for (m = 1; m <= 12; m++) {
                yearDays += (lunarInfo[i] & (0x10000 >> m)) ? 30 : 29;
            }
            if (leap > 0) {
                yearDays += (lunarInfo[i] & 0x10000) ? 30 : 29;
            }
            if (offset < yearDays) break;
            offset -= yearDays;
        }

        if (i >= lunarInfo.length) return { lunar: '' };

        var lunarYear = 1900 + i;
        leap = lunarInfo[i] & 0xf;
        var months = 12;
        if (leap > 0) months = 13;

        // Find the lunar month
        for (m = 1; m <= months && offset > 0; m++) {
            if (leap > 0 && m === leap + 1) {
                temp = (lunarInfo[i] & 0x10000) ? 30 : 29;
            } else {
                var regM = (leap > 0 && m > leap) ? m - 1 : m;
                temp = (lunarInfo[i] & (0x10000 >> regM)) ? 30 : 29;
            }
            if (offset < temp) break;
            offset -= temp;
        }

        isLeap = (leap > 0 && m === leap + 1);
        var lMonth = isLeap ? leap : (leap > 0 && m > leap ? m - 1 : m);
        var lDay = offset + 1;

        var yearStem = gan[(lunarYear - 4) % 10];
        var yearBranch = zhi[(lunarYear - 4) % 12];
        var zodiac = shengxiao[(lunarYear - 4) % 12];
        var monthName = (isLeap ? '闰' : '') + lunarMonth[lMonth - 1] + '月';
        var dayName = lunarDay[lDay - 1] || '';

        return { lunar: yearStem + yearBranch + ' ' + zodiac + '年 ' + monthName + dayName };
    }

    function saveCardPositions() {
        var positions = {};
        var slots = document.querySelectorAll('.card-slot');
        slots.forEach(function(slot) {
            var card = slot.querySelector('.module-card');
            if (card) {
                positions[slot.dataset.position] = {
                    module: card.dataset.module || 'clock'
                };
            }
        });
        
        fetch('{{ url('api:api_dashboard_cards_save') }}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': window.FFE.getCsrfToken()
            },
            body: JSON.stringify({ positions: positions }),
            credentials: 'include'
        }).then(function(response) {
            return response.json();
        }).then(function(data) {
            if (!data.success) {
                console.error('保存失败');
            }
        }).catch(function(error) {
            console.error('保存失败:', error);
        });
    }

    function applyCardColor(card, position) {
        var isOdd = (position % 2 === 1);
        var bgColor = isOdd ? 'var(--primary)' : 'var(--primary-light)';
        var textColor = isOdd ? '#fff' : 'var(--primary)';
        card.style.setProperty('background-color', bgColor, 'important');
        card.style.setProperty('color', textColor, 'important');
    }

    function createClockCard(position) {
        var isOdd = (position % 2 === 1);
        var bgColor = isOdd ? 'var(--primary)' : 'var(--primary-light)';
        var textColor = isOdd ? '#fff' : 'var(--primary)';
        
        var card = document.createElement('div');
        card.className = 'clock-card module-card';
        card.setAttribute('draggable', 'true');
        card.setAttribute('data-module', 'clock');
        card.style.cssText = 'background-color:' + bgColor + ' !important;color:' + textColor + ' !important;border:none;height:100%;padding:0.75rem;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:grab;';
        
        card.innerHTML = 
            '<div class="clock-date-weekday" style="font-size:0.875rem;opacity:0.75;margin-bottom:2px;">加载中...</div>' +
            '<div class="clock-lunar" style="font-size:0.875rem;opacity:0.75;margin-bottom:8px;">加载中...</div>' +
            '<div class="clock-time" style="font-size:1.5rem;font-weight:bold;letter-spacing:2px;">--:--:--</div>';
        
        return card;
    }

    function getModulePrefix(moduleId) {
        var typeMap = window._moduleTypes || {};
        var type = typeMap[moduleId];
        if (type === 'node') return '/nodes/';
        if (type === 'tool') return '/modules/';
        if (type === 'system') return '/modules/system/';
        return '/modules/';
    }

    function createCustomerCard(moduleId, position, stats) {
        var isOdd = (position % 2 === 1);
        var bgColor = isOdd ? 'var(--primary)' : 'var(--primary-light)';
        var textColor = isOdd ? '#fff' : 'var(--primary)';
        
        var moduleNames = {
            'customer': '海外客户',
            'customer_cn': '国内客户',
            'resident_info': '当前居民信息数'
        };
        var moduleName = moduleNames[moduleId] || moduleId;
        var total = stats ? stats.total : 0;
        var recent = stats ? stats.recent : 0;
        
        var card = document.createElement('a');
        card.href = getModulePrefix(moduleId) + moduleId + '/';
        card.className = 'clock-card module-card';
        card.setAttribute('draggable', 'true');
        card.setAttribute('data-module', moduleId);
        card.style.cssText = 'background-color:' + bgColor + ' !important;color:' + textColor + ' !important;border:none;height:100%;padding:0.75rem;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:grab;text-decoration:none;';
        
        card.innerHTML = 
            '<div class="card-title" style="font-size:1rem;font-weight:bold;margin-bottom:8px;">' + moduleName + '</div>' +
            '<div class="card-count" style="font-size:2rem;font-weight:bold;">' + total + '</div>' +
            '<div class="card-subtitle" style="font-size:0.75rem;opacity:0.75;margin-top:4px;">本周新增 ' + recent + ' 条</div>';
        
        return card;
    }

    function createRenderedCard(htmlContent, moduleId, position) {
        var temp = document.createElement('div');
        temp.innerHTML = htmlContent;
        var card = temp.firstElementChild;
        
        if (card) {
            card.classList.add('clock-card', 'module-card');
            card.setAttribute('draggable', 'true');
            card.dataset.module = moduleId;
        }
        
        return card || temp;
    }

    function createModuleCard(moduleId, templatePath, stats, position) {
        var isOdd = (position % 2 === 1);
        var bgColor = isOdd ? 'var(--primary)' : 'var(--primary-light)';
        var textColor = isOdd ? '#fff' : 'var(--primary)';
        
        var card = document.createElement('a');
        card.href = getModulePrefix(moduleId) + moduleId + '/';
        card.className = 'clock-card module-card';
        card.setAttribute('draggable', 'true');
        card.setAttribute('data-module', moduleId);
        card.setAttribute('data-template', templatePath);
        card.style.cssText = 'background-color:' + bgColor + ' !important;color:' + textColor + ' !important;border:none;height:100%;padding:0.75rem;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:grab;text-decoration:none;';
        
        var moduleNames = {
            'whatsapp': '📱 WhatsApp 发送',
            'customer': '👥 客户信息',
            'customer_cn': '🏠 国内客户',
            'resident_info': '📋 居民信息'
        };
        var moduleName = moduleNames[moduleId] || moduleId;
        
        var total = stats ? stats.total : 0;
        var recent = stats ? stats.recent : 0;
        
        card.innerHTML = 
            '<div class="card-title" style="font-size:1rem;font-weight:bold;margin-bottom:8px;">' + moduleName + '</div>' +
            '<div class="card-count" style="font-size:2rem;font-weight:bold;">' + total + '</div>' +
            '<div class="card-subtitle" style="font-size:0.75rem;opacity:0.75;margin-top:4px;">本周新增 ' + recent + ' 条</div>';
        
        loadModuleTemplate(card, moduleId, templatePath);
        
        return card;
    }
    
    function loadModuleTemplate(card, moduleId, templatePath) {
        if (!templatePath) return;
        
        fetch(getModulePrefix(moduleId) + moduleId + '/templates/' + templatePath, {credentials: 'include'})
            .then(function(response) { return response.text(); })
            .then(function(html) {
                if (html) {
                    card.innerHTML = html;
                    card.style.cssText = '';
                    card.classList.add('module-custom-card');
                    var pos = card.closest('.card-slot');
                    if (pos) {
                        pos.classList.add('custom-loaded');
                    }
                }
            })
            .catch(function(err) {
                console.error('加载模块模板失败:', moduleId, err);
            });
    }

    // ── 服务端时间管理 ──
    var serverTimeData = { timestamp: 0, recvTime: 0 };

    function fetchServerTime() {
        return fetch('{{ url('api:api_time_current') }}')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                serverTimeData.timestamp = data.timestamp;
                serverTimeData.recvTime = performance.now();
            })
            .catch(function() {
                serverTimeData.timestamp = Math.floor(Date.now() / 1000);
                serverTimeData.recvTime = performance.now();
            });
    }

    function getServerDate() {
        var elapsed = (performance.now() - serverTimeData.recvTime) / 1000;
        return new Date((serverTimeData.timestamp + elapsed) * 1000);
    }

    function updateClock() {
        var now = getServerDate();
        var timeEl = document.querySelector('.clock-time');
        var dateWeekdayEl = document.querySelector('.clock-date-weekday');
        var lunarEl = document.querySelector('.clock-lunar');
        
        if (timeEl) {
            timeEl.textContent = now.toLocaleTimeString('zh-CN', {hour12: false});
        }
        if (dateWeekdayEl) {
            var dateStr = now.toLocaleDateString('zh-CN');
            var weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            var weekdayStr = weekdays[now.getDay()];
            dateWeekdayEl.textContent = dateStr + ' ' + weekdayStr;
        }
        if (lunarEl) {
            var lunar = getLunarDate(now);
            lunarEl.textContent = lunar.lunar;
        }
    }

    function renderCards() {
        var slots = document.querySelectorAll('.card-slot');
        
        fetch('{{ url('api:api_dashboard_cards') }}', {credentials: 'include'})
            .then(function(response) { return response.json(); })
            .then(function(data) {
                if (data.success && data.data) {
                    cardPositions = data.data.positions || {};
                    var availableModules = data.data.available_modules || [];
                    var moduleStats = data.data.module_stats || {};
                    var moduleContents = data.data.module_contents || {};
                    var moduleClickable = data.data.module_clickable || {};
                    window._moduleTypes = data.data.module_types || {};
                    
                    slots.forEach(function(slot) {
                        var position = slot.dataset.position;
                        var cardData = cardPositions[position];
                        
                        if (cardData && cardData.module) {
                            var moduleId = cardData.module;
                            if (availableModules.indexOf(moduleId) === -1) return;
                            
                            if (moduleContents[moduleId]) {
                                slot.innerHTML = moduleContents[moduleId];
                                var card = slot.querySelector('.module-card');
                                if (card && moduleClickable[moduleId] !== false) {
                                    card.onclick = function() {
                                        window.location.href = getModulePrefix(moduleId) + moduleId + '/';
                                    };
                                    card.style.cursor = 'pointer';
                                }
                            } else {
                                var card;
                                if (moduleId === 'clock') {
                                    card = createClockCard(parseInt(position));
                                } else {
                                    card = createCustomerCard(moduleId, parseInt(position), moduleStats[moduleId]);
                                }
                                card.dataset.module = moduleId;
                                slot.appendChild(card);
                            }
                        }
                    });
                }
                
                initDragAndDrop();
            })
            .catch(function() {
                console.error('加载卡片失败');
                initDragAndDrop();
            });
    }

    function onCardDrop(draggingCard, toSlot) {
        var fromSlot = draggingCard.closest('.card-slot');
        if (fromSlot === toSlot) return;
        
        var toCard = toSlot.querySelector('.module-card');
        var newPosition = parseInt(toSlot.dataset.position);
        var fromPosition = parseInt(fromSlot.dataset.position);
        
        toSlot.innerHTML = '';
        toSlot.appendChild(draggingCard);
        
        if (toCard) {
            fromSlot.innerHTML = '';
            fromSlot.appendChild(toCard);
            
            var tempModule = cardPositions[fromPosition];
            cardPositions[fromPosition] = cardPositions[newPosition];
            cardPositions[newPosition] = tempModule;
        } else {
            cardPositions[newPosition] = cardPositions[fromPosition];
            cardPositions[fromPosition] = {module: null, size: 'medium', config: {}};
        }
        
        saveCardPositions();
    }

    function initDragAndDrop() {
        window.FFE.DragDrop.makeSortable('.card-slot', '.module-card', '.card-slot', onCardDrop);
    }

    // 初始化
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            renderCards();
            fetchServerTime().then(function() {
                updateClock();
                if (!window._clockInterval) {
                    window._clockInterval = setInterval(updateClock, 1000);
                }
                if (!window._syncInterval) {
                    window._syncInterval = setInterval(fetchServerTime, 60000);
                }
            });
        });
    }
})();
</script>
